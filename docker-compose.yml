services:
  facebook-archive:
    build: .
    container_name: facebook-archive
    env_file:
      - .env
    ports:
      - "127.0.0.1:8080:3000"
    environment:
      PORT: 3000
      LIBRARY_DIR: /library
      COOKIE_FILE: ${COOKIE_FILE:-}
      MONGODB_URI: ${MONGODB_URI:?Set MONGODB_URI in .env}
      MONGODB_DATABASE: ${MONGODB_DATABASE:-facebook_archive}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - ./library:/library
      - ./config:/config:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/videos').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"
    restart: unless-stopped

